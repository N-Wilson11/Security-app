<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recente security risico's</title>
<meta name="theme-color" content="#101d36">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
*{box-sizing:border-box}
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17233b;background:#f4f6fa;font-synthesis:none;text-rendering:optimizeLegibility}
body{min-width:320px;margin:0;background:radial-gradient(ellipse at 85% 0%,#dce8f8 0,transparent 34rem),#f4f6fa}
header{position:relative;overflow:hidden;padding:2.5rem max(1.25rem,calc((100vw - 940px)/2)) 3.75rem;color:#f8fbff;background:linear-gradient(120deg,#101d36 0%,#172d50 58%,#204c75 100%)}
header::after{position:absolute;top:-11rem;right:max(0px,calc((100vw - 1100px)/2));width:27rem;height:27rem;border:1px solid #ffffff20;border-radius:50%;box-shadow:0 0 0 3rem #ffffff08,0 0 0 6rem #ffffff06;content:"";pointer-events:none}
.brand{display:flex;align-items:center;gap:.65rem;color:#b9d6f2;font-size:.75rem;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
.brand-mark{display:grid;width:2rem;height:2rem;place-items:center;border:1px solid #ffffff38;border-radius:.65rem;color:#fff;background:#ffffff12;font-size:.9rem;letter-spacing:0}
header h1{position:relative;margin:1.75rem 0 .45rem;font-size:clamp(2rem,5vw,3rem);font-weight:720;letter-spacing:-.045em;line-height:1.08}
.subtitle{position:relative;max-width:39rem;margin:0;color:#c0ccdc;font-size:1rem;line-height:1.65}
#status{position:relative;display:inline-flex;align-items:center;gap:.55rem;margin-top:1.35rem;padding:.5rem .75rem;border:1px solid #ffffff24;border-radius:999px;color:#e3edf8;background:#ffffff0d;font-size:.8rem}
#status::before{width:.45rem;height:.45rem;border-radius:50%;background:#71d7a2;content:""}
#status.has-error{color:#ffd4d4}#status.has-error::before{background:#ff727c}
main{max-width:940px;margin:-1.35rem auto 0;padding:0 1.25rem 4rem}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin:0 0 1rem;padding:1.35rem 0 .25rem}
.section-heading h2{margin:0;color:#17233b;font-size:1.1rem;font-weight:700;letter-spacing:-.02em}
.section-heading p{margin:0;color:#78859a;font-size:.82rem}
#list{display:grid;gap:.85rem}
.card{position:relative;overflow:hidden;padding:1.25rem 1.4rem 1.3rem 1.55rem;border:1px solid #e4e9f1;border-radius:1rem;background:#fff;box-shadow:0 4px 16px #2239570a;transition:transform .18s ease,box-shadow .18s ease}
.card::before{position:absolute;inset:0 auto 0 0;width:4px;background:#a5afbf;content:""}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px #22395712}
.card.kritiek::before{background:#d94b55}.card.hoog::before{background:#e58437}.card.middel::before{background:#d5a522}.card.laag::before{background:#3d9b73}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.65rem}
.meta{color:#8591a3;font-size:.78rem}
.severity{padding:.25rem .55rem;border-radius:999px;color:#59667a;background:#eef1f6;font-size:.68rem;font-weight:750;letter-spacing:.055em;text-transform:uppercase}
.kritiek .severity{color:#a42d39;background:#fff0f0}.hoog .severity{color:#a84e19;background:#fff3e9}.middel .severity{color:#80600d;background:#fff8df}.laag .severity{color:#287453;background:#eaf7f0}
.card h3{margin:0;color:#1b2b45;font-size:1.05rem;font-weight:680;letter-spacing:-.015em;line-height:1.5}
.card a{color:inherit;text-decoration:none;text-decoration-thickness:1px;text-underline-offset:3px}
.card a:hover{color:#24619a;text-decoration:underline}
.card a:focus-visible{border-radius:3px;outline:3px solid #7bb7ed;outline-offset:3px}
pre{margin:.65rem 0 0;color:#657287;font-family:inherit;font-size:.88rem;line-height:1.65;white-space:pre-wrap}
.empty,.error{padding:1.5rem;border:1px solid #e4e9f1;border-radius:1rem;color:#657287;background:#fff}
.error{color:#a42d39}
.pagination{display:flex;align-items:center;justify-content:center;gap:.9rem;margin-top:1.25rem}
.pagination button{min-height:2.5rem;padding:.55rem .9rem;border:1px solid #dce3ed;border-radius:.7rem;color:#263b57;background:#fff;font:inherit;font-size:.85rem;font-weight:650;cursor:pointer;transition:background .18s ease,border-color .18s ease}
.pagination button:hover:not(:disabled){border-color:#9bb5d1;background:#edf4fb}
.pagination button:focus-visible{outline:3px solid #7bb7ed;outline-offset:2px}
.pagination button:disabled{color:#a4adba;background:#f1f3f6;cursor:not-allowed}
.page-status{min-width:8rem;color:#657287;font-size:.82rem;text-align:center}
@media(max-width:600px){header{padding:1.75rem 1.25rem 3.25rem}.section-heading{align-items:start;flex-direction:column;gap:.3rem}.card{padding:1.1rem 1rem 1.1rem 1.25rem}.card-top{align-items:start;flex-direction:column-reverse;gap:.55rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="brand-mark" aria-hidden="true">NSi</span>Nathan's Security intelligence</div>
  <h1>Blijf een stap vooruit.</h1>
  <p class="subtitle">Actuele beveiligingsadviezen van het NCSC, overzichtelijk op een rij. Bekijk direct wat er speelt en welke actie nodig is.</p>
  <div id="status" role="status">Adviezen ophalen…</div>
</header>
<main>
  <div class="section-heading">
    <h2>Recente advisories</h2>
    <p>Updates rechtstreeks van het NCSC</p>
  </div>
  <div id="list" aria-live="polite"><div class="empty">Adviezen laden…</div></div>
  <div id="pagination"></div>
</main>
<script>
const el = (t, props = {}, ...kids) => { const n = Object.assign(document.createElement(t), props); n.append(...kids); return n; };
const PAGE_SIZE = 5;
let advisories = [];
let currentPage = 1;

function renderAdvisories() {
  const list = document.getElementById('list');
  const pagination = document.getElementById('pagination');
  const pageCount = Math.ceil(advisories.length / PAGE_SIZE);
  currentPage = Math.min(currentPage, Math.max(pageCount, 1));

  if (!advisories.length) {
    list.replaceChildren(el('div', { className: 'empty', textContent: 'Geen advisories beschikbaar.' }));
    pagination.replaceChildren();
    return;
  }

  const pageItems = advisories.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
  list.replaceChildren(...pageItems.map((a) => {
    const card = el('div', { className: 'card ' + a.severity });
    const severity = a.severity ? a.severity : 'Advisory';
    const top = el('div', { className: 'card-top' },
      el('span', { className: 'severity', textContent: severity }),
      el('span', { className: 'meta', textContent: (a.published ? new Date(a.published).toLocaleString('nl-NL') : '') }));
    const h = el('h3', {}, a.link ? el('a', { href: a.link, target: '_blank', rel: 'noopener', textContent: a.title }) : a.title);
    card.append(top, h, el('pre', { textContent: a.summary }));
    return card;
  }));

  if (pageCount <= 1) {
    pagination.replaceChildren();
    return;
  }

  const start = (currentPage - 1) * PAGE_SIZE + 1;
  const end = Math.min(currentPage * PAGE_SIZE, advisories.length);
  const nav = el('nav', { className: 'pagination' });
  nav.setAttribute('aria-label', 'Paginering advisories');
  nav.append(
    el('button', { type: 'button', textContent: 'Vorige', disabled: currentPage === 1, onclick: () => changePage(currentPage - 1) }),
    el('span', { className: 'page-status', textContent: `${start}–${end} van ${advisories.length}` }),
    el('button', { type: 'button', textContent: 'Volgende', disabled: currentPage === pageCount, onclick: () => changePage(currentPage + 1) }),
  );
  pagination.replaceChildren(nav);
}

function changePage(page) {
  currentPage = page;
  renderAdvisories();
}

async function load() {
  const list = document.getElementById('list');
  try {
    const d = await (await fetch('/api/advisories')).json();
    const status = document.getElementById('status');
    status.classList.toggle('has-error', Boolean(d.error));
    status.textContent = d.updatedAt
      ? 'Bijgewerkt: ' + new Date(d.updatedAt).toLocaleString('nl-NL') : 'Nog niet geladen';
    if (d.error) status.append(' – fout: ' + d.error);
    advisories = d.advisories;
    renderAdvisories();
    setTimeout(load, Math.max(1, d.refreshMinutes) * 60000);
  } catch (e) {
    document.getElementById('status').classList.add('has-error');
    document.getElementById('status').textContent = 'Verbinding met de feed mislukt';
    list.replaceChildren(el('div', { className: 'error', textContent: 'Kon gegevens niet laden. Er wordt opnieuw geprobeerd.' }));
    document.getElementById('pagination').replaceChildren();
    setTimeout(load, 60000);
  }
}
load();
</script>
</body>
</html>
